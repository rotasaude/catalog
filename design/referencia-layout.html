<style>
:root {

}
@media (prefers-color-scheme: dark) {

    --ok: #6fd39e; --ok-soft: #16301f; --val: #e8b765; --val-soft: #33280f; --plan: #9cc3ee; --plan-soft: #172638;
    --road: #b3c0c3; --road-soft: #232d30;
  }
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--body); padding-inline: 20px; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 40px 72px; display: flex; flex-direction: column; gap: 40px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.top { display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 17px; }
.brand svg { flex-shrink: 0; }
.top h1 { font-size: clamp(30px, 6vw, 42px); font-weight: 700; letter-spacing: -0.01em; }
.lead { font-size: 18px; max-width: 62ch; }
.cycle { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 700; font-size: 14px; }

.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jump a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-size: 14px; }
.jump a span { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-right: 6px; }
.jump a:hover { border-color: var(--accent); }

.mods { display: flex; flex-direction: column; gap: 12px; }
.mod { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; scroll-margin-top: 20px; }
.mod[open] { border-color: var(--accent); }
.mod summary { list-style: none; display: flex; align-items: flex-start; gap: 16px; padding: 18px 20px; cursor: pointer; }
.mod summary::-webkit-details-marker { display: none; }
.mod summary:hover { background: var(--surface-2); }
.mod summary:hover h2 { text-decoration: underline; text-underline-offset: 3px; }
.s-main { flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.s-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.s-title .num { font-family: var(--mono); font-size: 13.5px; color: var(--muted); }
.s-title h2 { font-size: 22px; }
.s-desc { font-size: 15.5px; max-width: 64ch; }
.mod .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); padding-top: 4px; }
.caret { flex-shrink: 0; margin-top: 4px; color: var(--muted); transition: transform 0.15s ease; }
.mod[open] .caret { transform: rotate(180deg); color: var(--accent); }
.mod.off .s-title h2, .mod.off .s-desc { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .caret { transition: none; } }

.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--paper); }
.items a { padding-left: 20px; }
.items li + li { border-top: 1px solid var(--line); }
.items a { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 16px; color: var(--ink); text-decoration: none; }
.items a:hover { background: var(--surface-2); }
.items a:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.items .t { flex-grow: 1; }
.items .tag { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.items .chev { color: var(--muted); flex-shrink: 0; }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 7px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; line-height: 1; }
.badge svg { flex-shrink: 0; }
.b-available { color: var(--ok); background: var(--ok-soft); }
.b-validating { color: var(--val); background: var(--val-soft); }
.b-planned { color: var(--plan); background: var(--plan-soft); }
.b-disabled { color: var(--road); background: transparent; border: 1px solid var(--line-strong); }

/* detail */
.detail { display: flex; flex-direction: column; gap: 28px; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 600; text-decoration: none; }
.back:hover { text-decoration: underline; }
.d-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(20px, 5vw, 40px); display: flex; flex-direction: column; gap: 20px; }
.d-eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 14px; color: var(--muted); }
.d-eyebrow .id { font-family: var(--mono); font-size: 13px; }
.d-card h1 { font-size: clamp(28px, 5.5vw, 40px); font-weight: 700; letter-spacing: -0.01em; }
.d-benefit { font-size: 20px; line-height: 1.5; max-width: 60ch; }
.d-note { font-size: 15px; color: var(--muted); padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
.d-sec { display: flex; flex-direction: column; gap: 10px; padding-top: 20px; border-top: 1px solid var(--line); }
.d-sec h2 { font-size: 15px; font-family: var(--body); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.surfaces { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.surfaces li { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 12px; background: var(--accent-soft); }
.surfaces li svg { flex-shrink: 0; color: var(--accent); margin-top: 2px; }
.surfaces b { display: block; font-weight: 600; }
.surfaces span { font-size: 14px; color: var(--muted); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; min-height: 64px; }
.pager a:hover { border-color: var(--accent); }
.pager a small { font-size: 13px; color: var(--muted); }
.pager a.next { text-align: right; grid-column: 2; }
.foot { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
@media (max-width: 560px) {
  .mod-head .meta { margin-left: 0; width: 100%; }
  .items .tag { display: none; }
  .pager { grid-template-columns: 1fr; }
  .pager a.next { grid-column: 1; }
}
</style>

  { id: '07', name: 'LGPD e auditoria', status: 'available', items: [

  { id: '08', name: 'Agendamento', status: 'available', items: [
    ['Pedido criado a partir do retorno ou encaminhamento', 'Quando o atendimento termina em retorno ou encaminhamento, o pedido entra na fila da unidade de destino.', 's'],

  ]},
  { id: '09', name: 'Unidades de saúde', status: 'available', items: [
    ['Cadastro de unidades de saúde', 'O administrador da cidade cadastra e edita UBS, UPAs, hospitais e outras unidades.', 's'],
    ['Desativar e reativar unidade', 'A desativação é recusada enquanto houver atendimento ou horário aberto na unidade.', 's']

  { id: '10', name: 'Profissionais', status: 'validating', items: [
    ['Cadastro do profissional ligado ao usuário', 'Em validação: perfil do profissional ligado ao usuário do sistema.', 's', 'validating'],

const DESC = {
  '01': 'Canal opcional pelo WhatsApp, desativado desde 27/09/2026. O cidadão é atendido pela web.',
  '02': 'Conduz o cidadão do aceite do termo até o resultado, uma conversa por vez, e registra o consentimento.',
  '03': 'Cada cidade escreve os próprios protocolos de triagem, e nenhum entra em uso sem dupla revisão.',
  '04': 'Cada triagem vira um relatório que não muda depois de emitido, aberto por um link seguro e temporário.',
  '05': 'Telas de acompanhamento da cidade, só de leitura, sem expor respostas clínicas ou a identidade do cidadão.',
  '06': 'Define quem entra e o que pode fazer, com confirmação por código nas ações sensíveis.',
  '07': 'Banco e chave próprios por cidade, trilha de auditoria que não se apaga e prazos de retenção cumpridos.',
  '08': 'Leva o cidadão de volta à unidade: pedido na fila, horário marcado, confirmação e check-in.',
  '09': 'Cadastro das UBS, UPAs e hospitais da cidade, base do check-in e do agendamento.',
  '10': 'Em validação: cadastro de profissionais, vínculos com as unidades e registro de turnos.'
};
const OPEN = new Set();
const FEATS = [];
MODS.forEach((m) => m.items.forEach((it, i) => {
  const f = { key: `f-${m.id}.${i + 1}`, ref: `F-${m.id}.${i + 1}`, mod: m, idx: i, title: it[0], benefit: it[1], surf: it[2].split('').filter(Boolean), status: it[3] || (m.status === 'disabled' ? 'disabled' : 'available'), note: it[4] || (m.status === 'disabled' ? m.note : '') };
  m.feats = m.feats || []; m.feats.push(f); FEATS.push(f);
}));
const BY = Object.fromEntries(FEATS.map((f) => [f.key, f]));

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const badge = (st) => `<span class="badge b-${st}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">${ST[st][1]}</svg>${ST[st][0]}</span>`;
const brand = `<div class="brand"><svg width="28" height="28" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><circle cx="10" cy="24" r="3.2" fill="var(--accent-ink)"/><circle cx="24" cy="10" r="3.2" fill="var(--accent-ink)"/><path d="M10 24c0-7 14-7 14-14" fill="none" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round"/></svg>Rota Saúde</div>`;
const chev = '<svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5l4.5 4.5L6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function modMeta(m) {
  const n = m.feats.length;
  if (m.status === 'validating') return `${badge('validating')}<span>5 de ${n} entregues</span>`;
  if (m.status === 'disabled') return `${badge('disabled')}<span>${n} funcionalidades</span>`;
  return `${badge('available')}<span>${n} funcionalidades</span>`;
}

function renderList() {
  document.title = 'Funcionalidades Rota Saúde';
  return `
    <header class="top">
      ${brand}
      <span class="cycle">Ciclo 1 · módulos 01 a 10</span>
      <h1>Funcionalidades do Ciclo 1</h1>
      <p class="lead">As funcionalidades do primeiro ciclo de desenvolvimento, separadas por módulo. Abra um módulo e toque numa funcionalidade para ver o que ela faz e onde aparece.</p>
    </header>
    <div class="mods">
    ${MODS.map((m) => `
      <details class="mod${m.status === 'disabled' ? ' off' : ''}" id="m-${m.id}" data-mod="${m.id}"${OPEN.has(m.id) ? ' open' : ''}>
        <summary>
          <span class="s-main">
            <span class="s-title"><span class="num">Módulo ${m.id}</span><h2>${esc(m.name)}</h2></span>
            <span class="s-desc">${esc(DESC[m.id])}</span>
            <span class="meta">${modMeta(m)}</span>
          </span>
          <svg class="caret" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <ul class="items">
          ${m.feats.map((f) => `<li><a href="#${f.key}"><span class="t">${esc(f.title)}</span>${f.status !== m.status || f.status === 'validating' ? `<span class="tag">${ST[f.status][0]}</span>` : ''}${chev}</a></li>`).join('')}
        </ul>
      </details>`).join('')}
    </div>
    <p class="foot">Conteúdo verificado até 28 set 2026. Os módulos 02 a 09 estão disponíveis e verificados; o 10 está em validação.</p>`;
}

function renderDetail(f) {
  const m = f.mod, prev = m.feats[f.idx - 1], next = m.feats[f.idx + 1];
  document.title = `${f.title} · Rota Saúde`;
  const surf = f.surf.length
    ? `<ul class="surfaces">${f.surf.map((k) => `<li>${ICON[k]}<div><b>${S[k][0]}</b><span>${S[k][1]}</span></div></li>`).join('')}</ul>`
    : `<p class="d-note">Sem tela em uso: depende de um canal desativado.</p>`;
  return `
    ${brand}
    <a class="back" href="#m-${m.id}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Todas as funcionalidades</a>
    <article class="detail">
      <div class="d-card">
        <div class="d-eyebrow"><span>Módulo ${m.id} · ${esc(m.name)}</span><span class="id">${f.ref}</span></div>
        <h1 id="d-title" tabindex="-1">${esc(f.title)}</h1>
        <div>${badge(f.status)}</div>
        <p class="d-benefit">${esc(f.benefit)}</p>
        ${f.note ? `<p class="d-note">${esc(f.note)}</p>` : ''}
        <section class="d-sec" aria-labelledby="d-onde"><h2 id="d-onde">Onde aparece</h2>${surf}</section>
      </div>
      <nav class="pager" aria-label="Outras funcionalidades do módulo">
        ${prev ? `<a class="prev" href="#${prev.key}"><small>← Anterior</small>${esc(prev.title)}</a>` : ''}
        ${next ? `<a class="next" href="#${next.key}"><small>Próxima →</small>${esc(next.title)}</a>` : ''}
      </nav>
    </article>`;
}

let lastList = null;
function route() {
  const app = document.getElementById('app');
  const h = decodeURIComponent(location.hash.slice(1));
  const f = BY[h];
  if (f) {
    app.innerHTML = renderDetail(f);
    window.scrollTo(0, 0);
    const t = document.getElementById('d-title'); if (t) t.focus({ preventScroll: true });
  } else {
    if (/^m-\d\d$/.test(h)) OPEN.add(h.slice(2));
    app.innerHTML = renderList();
    app.querySelectorAll('details.mod').forEach((d) => d.addEventListener('toggle', () => {
      if (d.open) OPEN.add(d.dataset.mod); else OPEN.delete(d.dataset.mod);
    }));
    const target = h && document.getElementById(h);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
}
window.addEventListener('hashchange', route);
route();
</script>
